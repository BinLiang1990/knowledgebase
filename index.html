<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多维知识库 · 管理后台 Demo</title>
<style>
:root{
  --brand:#2f6bff; --brand-deep:#1a56f0; --brand-light:#6aa9ff; --brand-light2:#5a8ffb; --brand-pale:#9dbdfb;
  --grad-btn:linear-gradient(135deg,#2f6bff,#5a8ffb);
  --grad-bar:linear-gradient(90deg,#2f6bff,#6aa9ff);
  --grad-mark:linear-gradient(180deg,#2f6bff,#6aa9ff);
  --blue:#2f6bff;   --blue-bd:#c9dcfc;   --blue-bg:#eef4ff;
  --green:#0f9d58;  --green-bd:#bfe9d2;  --green-bg:#f2fbf6;
  --orange:#e08600; --orange-bd:#f5ddb0; --orange-bg:#fdf7ea;
  --red:#e5484d;    --red-bd:#f7c6c8;    --red-bg:#fff2f2;
  --purple:#7a5af8; --purple-bd:#e0d7fb; --purple-bg:#f7f4ff;
  --gray:#7f8ca3;   --gray-bd:#dde5f1;   --gray-bg:#f5f8fd;
  --ink-1:#1f2b43; --ink-2:#33415c; --ink-3:#5b6b85; --ink-4:#7f8ca3;
  --ink-5:#8a97ad; --ink-6:#9aa7bd; --ink-7:#b6c0d2;
  --page-bg:radial-gradient(circle at 50% 40%, #eef2f9 0%, #e3e9f4 70%, #d8e0ee 100%);
  --surface:#fff; --pale:#f5f8fd; --row-hover:#fafcff;
  --line:#edf1f8; --line-weak:#f0f4fa; --bd-input:#dde5f1; --bd-card:#e8eef8; --bd-float:#e2e9f4;
  --rule:linear-gradient(90deg,#e4ebf7,transparent);
  --r-sm:8px; --r-md:9px; --r-lg:12px; --r-card:14px; --r-modal:18px; --r-pill:999px;
  --sh-card:0 4px 18px rgba(31,66,135,.05);
  --sh-btn:0 5px 12px rgba(47,107,255,.3);
  --sh-float:0 14px 38px rgba(18,35,68,.16);
  --sh-toast:0 10px 26px rgba(10,25,60,.3);
  --sh-modal:0 30px 80px rgba(10,25,60,.35);
  --t:.15s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--page-bg)}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink-1);font-size:14px;overflow:hidden}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a.danger{color:var(--red)}
.num{font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.5px}
.h-bar{width:5px;border-radius:3px;background:var(--grad-mark);flex:none}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#cfd9ea;border-radius:3px}

/* ===== 布局骨架 A 型 ===== */
#app{display:flex;width:100%;height:100%}
#side{width:228px;flex:none;background:#fff;border-right:1px solid #e9eef7;box-shadow:2px 0 12px rgba(31,66,135,.04);z-index:6;display:flex;flex-direction:column}
#side .logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
#side .logo .h-bar{height:36px}
#side .logo .t1{font-size:16px;font-weight:700;color:var(--ink-1)}
#side .logo .t2{font-size:10px;color:var(--ink-6);letter-spacing:2.5px}
#side nav{flex:1;overflow-y:auto;padding:12px 0}
#side nav::-webkit-scrollbar{width:5px} #side nav::-webkit-scrollbar-thumb{background:#d5deee}
.nav-group{font-size:12px;color:var(--ink-6);letter-spacing:2px;padding:14px 20px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--ink-3);cursor:pointer;position:relative;transition:all var(--t)}
.nav-item .ico{width:16px;text-align:center;flex:none}
.nav-item:hover{background:var(--pale);color:var(--brand)}
.nav-item.on{background:var(--blue-bg);color:var(--brand-deep);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
#side .side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-6);line-height:1.7}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:64px;flex:none;background:#fff;box-shadow:0 2px 10px rgba(31,66,135,.06);z-index:5;display:flex;align-items:center;gap:14px;padding:0 28px}
#top .h-bar{height:30px}
#top h1{font-size:18px;color:var(--ink-1);font-weight:700}
#top .crumb{font-size:13px;color:var(--ink-5)}
#top .spacer{flex:1}
.badge-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 12px;border-radius:var(--r-pill);border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green)}
.badge-pill i{width:7px;height:7px;border-radius:50%;background:var(--green)}
#clock{text-align:right}
#clock .tm{font-size:20px;color:var(--ink-1)}
#clock .dt{font-size:12px;color:var(--ink-5)}
#avatar{width:34px;height:34px;border-radius:50%;background:var(--grad-btn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
#content{flex:1;overflow-y:auto;padding:18px 28px 32px}

/* ===== 组件 ===== */
.card{background:#fff;border-radius:var(--r-card);box-shadow:var(--sh-card);padding:18px 22px;margin-bottom:16px;overflow-x:auto}
.card.ov{overflow:visible}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .tick{width:4px;height:16px;border-radius:2px;background:var(--brand);flex:none}
.card-head h3{font-size:17px;color:var(--ink-1);white-space:nowrap}
.card-head .sub{font-size:12px;color:var(--ink-5);margin-left:4px;white-space:nowrap}
.card-head .spacer{flex:1;height:1px;background:var(--rule);margin:0 10px;min-width:20px}

.btn{height:34px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--bd-input);background:#fff;color:var(--ink-3);font-size:13px;transition:all var(--t);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--brand-pale);color:var(--brand)}
.btn.primary{background:var(--grad-btn);border:none;color:#fff;font-weight:600;box-shadow:var(--sh-btn)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--red);border-color:#f3c1c3}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{height:28px;padding:0 12px;font-size:12px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.5;cursor:not-allowed}

input[type=text],input[type=date],select,textarea{
  border:1px solid var(--bd-input);border-radius:var(--r-md);padding:8px 12px;font-size:13.5px;
  color:var(--ink-2);background:#fff;outline:none;min-width:150px;font-family:inherit;transition:all var(--t)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
input::placeholder{color:var(--ink-7)}
select{cursor:pointer}
textarea{resize:vertical;min-height:70px;width:100%}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.f-lbl{font-size:13px;color:var(--ink-4);white-space:nowrap}

.tag{display:inline-block;font-size:12px;padding:2.5px 10px;border-radius:var(--r-pill);border:1px solid;margin:1px 4px 1px 0;white-space:nowrap}
.tag.blue{color:var(--blue);border-color:var(--blue-bd);background:var(--blue-bg)}
.tag.green{color:var(--green);border-color:var(--green-bd);background:var(--green-bg)}
.tag.orange{color:var(--orange);border-color:var(--orange-bd);background:var(--orange-bg)}
.tag.red{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.tag.purple{color:var(--purple);border-color:var(--purple-bd);background:var(--purple-bg)}
.tag.gray{color:var(--gray);border-color:var(--gray-bd);background:var(--gray-bg)}

.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--pale);color:var(--ink-4);font-size:13px;font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap}
.tbl th:first-child{border-radius:9px 0 0 9px}
.tbl th:last-child{border-radius:0 9px 9px 0}
.tbl td{padding:11px 12px;font-size:13.5px;border-bottom:1px solid var(--line-weak);color:var(--ink-2)}
.tbl tr:hover td{background:var(--row-hover)}
.tbl .empty{text-align:center;color:var(--ink-7);font-size:13.5px;padding:30px 0}
.tbl .tm{color:var(--ink-5);white-space:nowrap;font-size:12.5px}
.ops a{margin-right:12px;font-size:13px}
.ops a:last-child{margin-right:0}
.ops span.na{color:var(--ink-7)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd-card);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:18px 20px}
.stat .lbl{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.stat .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand-deep)}
.stat .val{font-size:36px;margin-top:8px;color:var(--brand-deep);line-height:1.1}
.stat .val small{font-size:14px;color:var(--ink-5);font-weight:600;margin-left:4px}
.stat .foot{font-size:12px;color:var(--ink-5);margin-top:8px}
.stat.c2 .lbl::before{background:var(--green)} .stat.c2 .val{color:var(--green)}
.stat.c3 .lbl::before{background:var(--purple)} .stat.c3 .val{color:var(--purple)}
.stat.c4 .lbl::before{background:var(--orange)} .stat.c4 .val{color:var(--orange)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs .tab{padding:12px 17px;font-size:14.5px;color:var(--ink-3);cursor:pointer;position:relative;transition:color var(--t)}
.tabs .tab:hover{color:var(--brand)}
.tabs .tab.active{color:var(--brand);font-weight:700}
.tabs .tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:2px;background:var(--brand)}

.desc{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.desc .di{display:flex;border-bottom:1px solid var(--line-weak);border-right:1px solid var(--line-weak);min-height:44px}
.desc .di .k{width:120px;flex-shrink:0;background:var(--pale);color:var(--ink-4);font-size:12.5px;padding:12px 14px}
.desc .di .v{flex:1;padding:12px 14px;font-size:13.5px;color:var(--ink-1);font-weight:600;word-break:break-all}
.desc .di.span3{grid-column:span 3}

.mask{position:fixed;inset:0;background:rgba(43,58,94,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:60px 20px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:var(--r-modal);width:560px;max-width:96vw;box-shadow:var(--sh-modal);overflow:hidden}
.modal.wide{width:1100px}
.mo-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--ink-1)}
.mo-head::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.mo-close{margin-left:auto;width:34px;height:34px;border-radius:var(--r-md);background:#f1f4fa;color:var(--ink-3);border:none;cursor:pointer;font-size:15px}
.mo-body{padding:20px 24px;max-height:62vh;overflow-y:auto}
.mo-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center}
.mf{margin-bottom:14px}
.mf label{font-size:13px;color:var(--ink-4);margin-bottom:6px;display:block}
.mf label .req{color:var(--red);margin-right:2px}
.mf .hint{font-size:12px;color:var(--ink-6);margin-top:4px}
.mf input[type=text],.mf input[type=date],.mf select{width:100%}
.risk{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:10px;padding:12px 16px;font-size:13px;color:#c0353a;line-height:1.8;margin-top:10px}

/* 下拉菜单(规范 §3.11,此前缺失导致"加一个条件"渲染成裸文本) */
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:280px;background:#fff;border:1px solid var(--bd-float);border-radius:12px;box-shadow:var(--sh-float);padding:6px;display:none;z-index:40;text-align:left}
.dd.open .dd-menu{display:block}
.dd-item{padding:9px 12px;border-radius:9px;cursor:pointer;display:block}
.dd-item:hover{background:var(--pale)}
.dd-item .t{font-size:13.5px;color:var(--ink-2);font-weight:600;display:block}
.dd-item .d{font-size:12px;color:var(--ink-6);margin-top:3px;line-height:1.6;display:block}
.dd-sep{height:1px;background:var(--line-weak);margin:5px 8px}
.dd-group{font-size:11px;color:var(--ink-7);letter-spacing:1px;padding:7px 12px 3px}
/* 立体全景(等距立方体) */
.cube-stage{perspective:1500px;display:flex;justify-content:center;padding:70px 0 210px}
.cube3{transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(45deg);position:relative;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.layer3{position:absolute;inset:0;transform-style:preserve-3d;display:grid;gap:6px;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.c3cell{border-radius:8px;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(31,66,135,.12);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;cursor:default;user-select:none;white-space:nowrap;overflow:hidden}
.c3cell.emptyc{background:#f0f3f9;color:var(--ink-7);border-style:dashed;font-weight:400}
.layer3-lbl{position:absolute;left:-12px;top:50%;transform:rotateZ(-45deg) rotateX(-58deg) translate(-100%,-50%);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.cube-legend{display:flex;gap:12px 20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);justify-content:center;margin-top:-70px;position:relative}
#tipCube{position:fixed;z-index:300;pointer-events:none;background:rgba(31,43,67,.94);color:#fff;font-size:12.5px;line-height:1.7;padding:8px 13px;border-radius:9px;opacity:0;transition:opacity .15s;max-width:300px;box-shadow:var(--sh-toast)}
#tipCube b{color:#8fb5ff}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:rgba(31,43,67,.92);color:#fff;border-radius:10px;padding:11px 22px;font-size:13.5px;box-shadow:var(--sh-toast);animation:tin .25s;display:flex;gap:8px;align-items:center}
.toast-item.ok::before{content:"✓";color:#4cd48f;font-weight:700}
.toast-item.err::before{content:"✕";color:#ff9a9e;font-weight:700}
.toast-item.info::before{content:"ℹ";color:#8fb5ff;font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.notice{background:linear-gradient(135deg,#eef4ff,#f7faff);border:1px solid #d9e6fd;border-radius:var(--r-lg);padding:13px 18px;font-size:13px;color:var(--ink-2);line-height:1.8;margin-bottom:16px}
.notice b{color:var(--brand-deep)}

.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-head h2{font-size:21px;color:var(--ink-1)}
.detail-head .meta{font-size:13px;color:var(--ink-5);margin-top:8px;display:flex;gap:18px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--brand);font-size:13px;padding:7px 14px;border-radius:var(--r-md);cursor:pointer;margin-bottom:14px}

.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;font-size:13px;color:var(--ink-4)}
.pager button{min-width:32px;height:32px;padding:0 10px;border-radius:var(--r-md);border:1px solid var(--bd-input);background:#fff;color:var(--ink-3);font-size:13px;cursor:pointer}
.pager button.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pager button:disabled{opacity:.45;cursor:not-allowed}

.trow{border-bottom:1px solid var(--line-weak);padding:6px 2px}
.trow:last-of-type{border-bottom:none}
.trow-main{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px;padding:8px 10px;transition:background var(--t)}
.trow-main:hover{background:var(--pale)}
.trow-main .arrow{color:var(--ink-6);width:14px;flex:none;font-size:12px}
.trm-meta{font-size:12.5px;color:var(--ink-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow-ans{margin:0 0 6px 34px;font-size:13px;color:var(--ink-2);line-height:1.9}
.tnode{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-md);color:var(--ink-2);cursor:pointer;transition:background var(--t)}
.tnode:hover{background:var(--pale)}
.tnode.sel{background:var(--blue-bg);color:var(--brand-deep);font-weight:600}
.tnode .cnt{font-size:12px;color:var(--ink-6);font-weight:400}
.kids{margin-left:18px;border-left:1px dashed #dbe3f0;padding-left:8px}

.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.status-dot i{width:7px;height:7px;border-radius:50%}
.status-dot.ok{color:var(--green)} .status-dot.ok i{background:var(--green)}
.status-dot.off{color:var(--ink-5)} .status-dot.off i{background:var(--ink-6)}
.status-dot.warn{color:var(--orange)} .status-dot.warn i{background:var(--orange)}

/* demo 专属:答案清单 / 时间轴 */
.ans-item{padding:16px 6px;border-bottom:1px solid var(--line-weak)}
.ans-item:last-child{border-bottom:none}
.ans-item .ai-content{font-size:15px;font-weight:600;color:var(--ink-1);line-height:1.8}
.ans-item .ai-cond{font-size:12.5px;color:var(--ink-5);margin-top:7px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ans-item .ai-cond .live{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:600}
.ans-item .ai-cond .live i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:#dbe3f0}
.tl-item{position:relative;padding:0 0 18px 12px}
.tl-item::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue-bd)}
.tl-item.dead::before{background:var(--ink-7);box-shadow:0 0 0 1px var(--gray-bd)}
.tl-item .tl-t{font-size:12.5px;color:var(--ink-5)}
.tl-item .tl-c{font-size:14px;color:var(--ink-1);font-weight:600;margin-top:4px;line-height:1.7}
.tl-item.dead .tl-c{color:var(--ink-6);text-decoration:line-through;font-weight:400}
.coordkey{font-size:12px;color:var(--ink-5)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}
.mini-note{font-size:12px;color:var(--ink-6);line-height:1.8}
.seg{display:inline-flex;border:1px solid var(--bd-input);border-radius:var(--r-md);overflow:hidden}
.seg button{border:none;background:#fff;color:var(--ink-3);font-size:12.5px;padding:6px 14px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--blue-bg);color:var(--brand-deep);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.quick-dates{display:inline-flex;gap:6px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo"><div class="h-bar"></div><div><div class="t1">多维知识库</div><div class="t2">MULTI-DIM KB</div></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">Demo v0.1 · 数据为演示样例<br>规范:《UI规范-企业信息管理平台》</div>
  </aside>
  <div id="main">
    <header id="top">
      <div class="h-bar"></div>
      <h1 id="pageTitle">知识主体列表</h1>
      <span class="crumb" id="crumb">知识管理 / 知识主体列表</span>
      <div class="spacer"></div>
      <span class="badge-pill"><i></i>演示环境 · 运行正常</span>
      <div id="clock"><div class="tm num" id="clkT">--:--:--</div><div class="dt" id="clkD">----</div></div>
      <div id="avatar">彭</div>
    </header>
    <main id="content"></main>
  </div>
</div>

/* ================= 查询引擎 ================= */
const TODAY='2026-08-07';
const S = { page:'list', qTime:TODAY, qMode:'now', kw:'', filters:{}, subj:null, tab:'now', pg:1,
            axisA:'', axisB:'__init', cubeExp:false, tlCoord:null, viewer:'admin', treeSel:null, ddOpen:false, ddDim:null, expanded:{S1:true} };

function dimByKey(k){ return DIMS.find(d=>d.key===k); }
function regionMatch(av, qv){ // 层级:答案的条件值 = 提问值 或 其祖先
  if(av===qv) return 2;
  const d=dimByKey('region'); let cur=qv;
  while(d.parent && d.parent[cur]){ cur=d.parent[cur]; if(cur===av) return 1; }
  return 0;
}
function compatible(a, Q){ // 规则1:答案写明的条件必须与提问相符;没问到的条件不过滤
  let score=0;
  for(const k in a.coord){
    if(Q[k]===undefined || Q[k]==='') continue;
    const m = (k==='region') ? regionMatch(a.coord[k], Q[k]) : (a.coord[k]===Q[k] ? 2 : 0);
    if(m===0) return null;
    score+=m;
  }
  return score;
}
function weightOf(c){ return Object.keys(c).reduce((t,k)=>t+((dimByKey(k)||{}).weight||50),0); }
function coordKey(c){ return Object.keys(c).sort().map(k=>k+':'+c[k]).join('|') || '(默认)'; }
function coordLabel(c){
  const ks=Object.keys(c);
  if(!ks.length) return '<span class="tag gray">默认答案 · 处处适用</span>';
  return ks.map(k=>`<span class="tag blue">${dimByKey(k).name} = ${c[k]}</span>`).join('');
}
// 竞争:不符出局 → 同条件取最新(跳过撤回) → 具体的赢
function resolve(subjId, Q, T){
  const groups={};
  ASSERTS.filter(a=>a.subj===subjId && a.vf<=T).forEach(a=>{
    const sc=compatible(a,Q); if(sc===null) return;
    const key=coordKey(a.coord);
    (groups[key]=groups[key]||{key, coord:a.coord, score:sc, chain:[]}).chain.push(a);
  });
  const out=[];
  for(const k in groups){
    const g=groups[k];
    g.chain.sort((x,y)=>y.vf.localeCompare(x.vf));
    const live=g.chain.find(a=>!a.revoked);
    if(!live) continue;
    g.cur=live; g.spec=Object.keys(g.coord).length; g.w=weightOf(g.coord);
    out.push(g);
  }
  out.sort((a,b)=> b.spec-a.spec || b.w-a.w || b.score-a.score || b.cur.vf.localeCompare(a.cur.vf));
  return out;
}

}

function toggleExpand(id){ S.expanded[id]=!S.expanded[id]; render(); }
function subjectTree(id, T){
  const groups={};
  ASSERTS.filter(a=>a.subj===id).forEach(a=>{
    const k=coordKey(a.coord);
    (groups[k]=groups[k]||{coord:a.coord, chain:[]}).chain.push(a);
  });
  const sec={def:[], dims:{}, multi:[]};
  Object.values(groups).forEach(g=>{
    g.chain.sort((x,y)=>y.vf.localeCompare(x.vf));
    g.cur=g.chain.find(x=>!x.revoked && x.vf<=T)||null;
    const ks=Object.keys(g.coord);
    if(ks.length===0) sec.def.push(g);
    else if(ks.length===1) (sec.dims[ks[0]]=sec.dims[ks[0]]||[]).push(g);
    else sec.multi.push(g);
  });
  const leaf=(g,label)=>{
    const arrow=label?label+' <span style="color:var(--ink-6)">→</span> ':'· ';
    if(!g.cur){ const last=g.chain[0];
      return `<div class="tnode" style="cursor:default;color:var(--ink-6);max-width:900px;white-space:normal">${arrow}<s>${esc(last.content)}</s> <span class="cnt">已撤回,留痕保存</span></div>`; }
    return `<div class="tnode" style="cursor:default;max-width:900px;white-space:normal">${arrow}${esc(g.cur.content)} <span class="cnt"><span class="num" style="font-weight:400">${g.cur.vf}</span> 起 · 共 ${g.chain.length} 版</span></div>`;
  };
  let h='<div class="kids" style="margin-left:26px;margin-bottom:8px">';
  if(sec.def.length) h+=`<div class="tnode" style="cursor:default">▾ <span class="tag gray">默认答案</span> <span class="cnt">没写条件,处处适用</span></div><div class="kids">${sec.def.map(g=>leaf(g)).join('')}</div>`;
  for(const k in sec.dims){
    const list=sec.dims[k];
    h+=`<div class="tnode" style="cursor:default">▾ <span class="tag purple">${dimByKey(k).name}</span> <span class="cnt">${list.length} 个取值,各有说法</span></div>
        <div class="kids">${list.map(g=>leaf(g, `<span class="tag blue">${g.coord[k]}</span>`)).join('')}</div>`;
  }
  if(sec.multi.length){
    h+=`<div class="tnode" style="cursor:default">▾ <span class="tag purple">组合条件</span> <span class="cnt">${sec.multi.length} 条</span></div>
        <div class="kids">${sec.multi.map(g=>leaf(g, Object.keys(g.coord).map(k=>`<span class="tag blue">${dimByKey(k).name} = ${g.coord[k]}</span>`).join(''))).join('')}</div>`;
  }
  return h+'</div>';
}
function pageList(){
  const T=S.qTime, Q=S.filters;
  const activeAsserts = ASSERTS.filter(a=>!a.revoked).length;
  const qDims=Object.keys(Q).filter(k=>Q[k]);
  const subjectHasCond=id=> qDims.every(k=> ASSERTS.some(a=>{
    if(a.subj!==id||a.revoked||a.coord[k]===undefined) return false;
    return k==='region' ? regionMatch(a.coord[k],Q[k])>0 : a.coord[k]===Q[k];
  }));
  const subs=SUBJECTS.filter(x=>(!S.kw || x.title.includes(S.kw) || x.code.includes(S.kw)) && (!qDims.length || subjectHasCond(x.id)));
  const PAGE=8, totalPg=Math.max(1,Math.ceil(subs.length/PAGE));
  if(S.pg>totalPg) S.pg=totalPg;
  const pageSubs=subs.slice((S.pg-1)*PAGE, S.pg*PAGE);
  const rows=pageSubs.map(x=>{
    const dimsUsed=usedDims(x.id).map(d=>d.name);
    const total=ASSERTS.filter(a=>a.subj===x.id).length;
    const latest=ASSERTS.filter(a=>a.subj===x.id).map(a=>a.vf).sort().pop();
    const hasCond=Object.keys(Q).some(k=>Q[k]);
    let ansLine='';
    if(!hasCond){
      const defChain=ASSERTS.filter(a=>a.subj===x.id && Object.keys(a.coord).length===0 && a.vf<=T).sort((m,n)=>n.vf.localeCompare(m.vf));
      const defCur=defChain.find(a=>!a.revoked);
      const condCnt=ASSERTS.filter(a=>a.subj===x.id && Object.keys(a.coord).length>0).length;
      ansLine = defCur
        ? `<span class="tag gray">默认</span> ${esc(defCur.content)}${condCnt?` <span style="font-size:12px;color:var(--ink-6)">· 另有 ${condCnt} 条带条件的说法,展开看</span>`:''}`
        : `<span style="color:var(--ink-7)">还没有默认答案</span>${condCnt?` <span style="font-size:12px;color:var(--ink-6)">· 有 ${condCnt} 条带条件的说法,展开看</span>`:''}`;
    } else {
      const gs=resolve(x.id, Q, T);
      const explicitGs=gs.filter(g=> qDims.every(k=> g.coord[k]!==undefined));
      const showGs=explicitGs.length?explicitGs:gs;
      if(!showGs.length) ansLine=`<span style="color:var(--ink-7)">这个条件、这个时间点还没有答案</span>`;
      else{
        const top=showGs[0], peers=showGs.filter(g=>g.spec===top.spec);
        const conflict=peers.length>1 && new Set(peers.map(g=>g.cur.content)).size>1;
        ansLine = conflict
          ? `这个条件下有 <b>${peers.length} 种说法</b>:${peers.map(g=>esc(g.cur.content.length>14?g.cur.content.slice(0,14)+'…':g.cur.content)).join(' / ')} <span class="tag orange">点详情分清</span>`
          : `${esc(top.cur.content)} ${coordLabel(top.coord)}${gs.length>1?` <span style="font-size:12px;color:var(--ink-6)">· 另有 ${gs.length-1} 种条件下的说法</span>`:''}`;
      }
    }
    const exp=!!S.expanded[x.id];
    return `<div class="trow">
      <div class="trow-main" onclick="toggleExpand('${x.id}')">
        <span class="arrow">${exp?'▾':'▸'}</span>
        <a onclick="event.stopPropagation();go('detail','${x.id}')" style="font-weight:600;font-size:14.5px">${x.title}</a>
        <span class="tag blue">${x.cat}</span>
        <span class="trm-meta">${total} 条答案 · 维度:${dimsUsed.join('、')||'仅时间'} · 最近更新 <span class="num" style="font-weight:400">${latest.slice(5)}</span></span>
        <span style="flex:1"></span>
        <span class="ops" onclick="event.stopPropagation()"><a onclick="go('detail','${x.id}')">查看详情</a><a class="danger" onclick="toast('演示环境不支持删除主体','info')">删除</a></span>
      </div>
      <div class="trow-ans">${S.qMode==='day'?('回看 <span class="num">'+T+'</span>'):'当前'}:${ansLine}</div>
      ${exp?subjectTree(x.id,T):''}
    </div>`;
  }).join('');
  return `
  <div class="stat-grid">
    <div class="stat"><div class="lbl">知识主体</div><div class="val num">${SUBJECTS.length}<small>个</small></div><div class="foot">认知/口径/规则三类样例</div></div>
    <div class="stat c2"><div class="lbl">在用答案</div><div class="val num">${activeAsserts}<small>条</small></div><div class="foot">另有 ${ASSERTS.length-activeAsserts} 条已撤回(留痕保存)</div></div>
    <div class="stat c3"><div class="lbl">启用维度</div><div class="val num">${DIMS.filter(d=>d.enabled).length}<small>个</small></div><div class="foot">时间为内置维度,不计入</div></div>
    <div class="stat c4"><div class="lbl">今日变更</div><div class="val num">2<small>条</small></div><div class="foot">全部留痕,可供 AI 追问</div></div>
  </div>
  ${filterBar()}
  <div class="card ov">
    <div class="card-head"><div class="tick"></div><h3>知识主体</h3><span class="sub">共 ${subs.length} 个 · 点行展开多维状态</span><div class="spacer"></div></div>
    ${rows || `<div class="tbl"><div class="empty" style="text-align:center;color:var(--ink-7);padding:30px 0">${qDims.length?'没有知识在这些条件下专门写过答案:减少条件,或换个条件试试':'暂无符合条件的知识主体'}</div></div>`}
    <div class="pager"><span>共 ${subs.length} 条 · 第 ${S.pg}/${totalPg} 页</span>
      <button ${S.pg<=1?'disabled':''} onclick="S.pg--;render()">上一页</button>
      ${Array.from({length:totalPg},(_,i)=>`<button class="${S.pg===i+1?'cur':''}" onclick="S.pg=${i+1};render()">${i+1}</button>`).join('')}
      <button ${S.pg>=totalPg?'disabled':''} onclick="S.pg++;render()">下一页</button></div>
  </div>`;
}

function pageDetail(){
  const s=SUBJECTS.find(x=>x.id===S.subj);

function usedDims(subjId){
  const set=new Set(); ASSERTS.filter(a=>a.subj===subjId).forEach(a=>Object.keys(a.coord).forEach(k=>set.add(k)));
  return DIMS.filter(d=>d.enabled && set.has(d.key));
}
function tabNow(s,T){
  const gs=resolve(s.id, S.filters, T);
  const hasCond=Object.keys(S.filters).some(k=>S.filters[k]);
  const uniqueTop = hasCond && gs.length>0 && (gs.length===1 || gs[0].spec>gs[1].spec);
  const list = !gs.length ? `<div class="tbl"><div class="empty" style="padding:30px 0;text-align:center;color:var(--ink-7)">这个条件、这个时间点还没有答案:换个时间,或放宽条件</div></div>`
    : gs.map((g,i)=>{
      const condTxt = Object.keys(g.coord).length
        ? '适用条件:'+Object.keys(g.coord).map(k=>dimByKey(k).name+' = '+g.coord[k]).join(' · ')
        : '默认答案 · 处处适用';
      return `<div class="ans-item">
        <div style="display:flex;align-items:flex-start;gap:16px">

          <span class="ops" style="font-size:12.5px;white-space:nowrap;padding-top:3px">
            <a onclick="openEditAns('${g.cur.id}')">编辑</a>${Object.keys(g.coord).length?`<a onclick="openPromoteAns('${g.cur.id}')">设为默认</a>`:''}<a class="danger" onclick="openDeleteAns('${g.cur.id}')">删除</a>
          </span>

        <div class="ai-cond">${uniqueTop&&i===0?'<span class="live"><i></i>此条件下生效</span>':''}<span>${condTxt}</span><span><span class="num">${g.cur.vf}</span> 起 · 共 ${g.chain.length} 版</span><span>${g.cur.by} 录入 · 来源 ${srcName(g.cur.src)}</span></div>
      </div>`;}).join('');
  return `
  <div class="form-row">${condPicker()}${hasCond?'<button class="btn sm" onclick="S.filters={};render()">清空条件</button>':''}</div>
  <div style="font-size:12.5px;color:var(--ink-6);margin:12px 2px 2px">${hasCond?`满足条件的答案 ${gs.length} 条`:`全部答案 ${gs.length} 条 · 一条知识本来就有多种答案,各管各的条件`}</div>
  ${list}`;
}
function tabTree(s,T){
  const used=usedDims(s.id);
  if(!used.length) return `<div class="mini-note">这条知识还没有带条件的答案,谈不上立体展开</div>`;
  if(!used.find(d=>d.key===S.axisA)) S.axisA=used[0].key;
  const bOpts=used.filter(d=>d.key!==S.axisA);
  if(S.axisB==='__init') S.axisB=bOpts.length?bOpts[0].key:'';
  if(S.axisB && !bOpts.find(d=>d.key===S.axisB)) S.axisB=bOpts.length?bOpts[0].key:'';
  const dimA=dimByKey(S.axisA), dimB=S.axisB?dimByKey(S.axisB):null;
  const uvals=k=>[...new Set(ASSERTS.filter(x=>x.subj===s.id&&x.coord[k]!==undefined).map(x=>x.coord[k]))];
  const rows=['(默认)',...uvals(S.axisA)];
  const lays=dimB?['(默认)',...uvals(S.axisB)]:['(全部)'];
  let times=[...new Set(ASSERTS.filter(x=>x.subj===s.id).map(x=>x.vf))].sort();
  if(times.length>5) times=times.slice(-5);
  const offAxis=ASSERTS.filter(x=>x.subj===s.id&&Object.keys(x.coord).some(k=>k!==S.axisA&&k!==(S.axisB||'__none__'))).length;
  const palette=[['#0f9d58','#e6f6ec'],['#1a56f0','#e8effe'],['#0fa8a2','#e5f5f4'],['#7a5af8','#f0ebfe'],['#e08600','#fdf3e0'],['#e5484d','#fdecec'],['#b0399f','#fbeaf8'],['#5b6b85','#eef1f6']];
  const colorOf={}; let ci=0; const legend={};
  function cellBest(rv,lv,t){
    const gs={};
    ASSERTS.forEach(x=>{
      if(x.subj!==s.id||x.vf>t) return;
      for(const k in x.coord){
        if(k===S.axisA){ if(x.coord[k]!==rv) return; }
        else if(dimB&&k===S.axisB){ if(x.coord[k]!==lv) return; }
        else return;
      }
      const key=coordKey(x.coord); (gs[key]=gs[key]||[]).push(x);
    });
    let best=null,bs=-1,bw=-1,bv='';
    for(const k in gs){ gs[k].sort((m,n)=>n.vf.localeCompare(m.vf)); const cur=gs[k].find(y=>!y.revoked); if(!cur)continue;
      const sp=Object.keys(cur.coord).length, w=weightOf(cur.coord);
      if(sp>bs||(sp===bs&&w>bw)||(sp===bs&&w===bw&&cur.vf>bv)){best=cur;bs=sp;bw=w;bv=cur.vf;} }
    return best;
  }
  const CELL=72, GAP=6;
  const W=times.length*CELL+(times.length-1)*GAP, H=rows.length*CELL+(rows.length-1)*GAP;
  const zGap=Math.min(Math.max(80,H*0.3),115);
  const layersHtml=lays.map((lv,li)=>{
    const z=((lays.length-1)/2-li)*(S.cubeExp?zGap*1.55:zGap);
    const cells=rows.map(rv=>times.map(t=>{
      const bAns=cellBest(rv, dimB?lv:null, t);
      if(!bAns) return `<div class="c3cell emptyc" data-tip="${dimA.name}=${rv}${dimB?' · '+dimB.name+'='+lv:''} · ${t.slice(5)}:这一天还没有适用答案">无</div>`;
      const key=coordKey(bAns.coord);
      if(!(key in colorOf)){ colorOf[key]=palette[ci++%palette.length]; legend[key]={c:colorOf[key],a:bAns}; }
      const fg=colorOf[key][0], bg=colorOf[key][1];
      const inherited=(rv!=='(默认)'&&bAns.coord[S.axisA]===undefined)||(dimB&&lv!=='(默认)'&&bAns.coord[S.axisB]===undefined);
      const tip=(`${dimA.name}=${rv}${dimB?' · '+dimB.name+'='+lv:''} · ${t.slice(5)}<br>「${esc(bAns.content)}」<br>来自「${condName(bAns.coord)}」那条${inherited?' · <b>继承而来</b>':''}`).replace(/"/g,'&quot;');
      return `<div class="c3cell" style="background:${bg};color:${fg}" data-tip="${tip}">${esc(bAns.content.slice(0,4))}</div>`;
    }).join('')).join('');
    return `<div class="layer3" style="transform:translateZ(${z}px);grid-template-columns:repeat(${times.length},${CELL}px);grid-auto-rows:${CELL}px">${dimB?`<div class="layer3-lbl">${dimB.name} = ${lv}</div>`:''}${cells}</div>`;
  }).join('');
  const legendHtml=Object.values(legend).map(v=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${v.c[1]};border:1.5px solid ${v.c[0]};margin-right:6px;vertical-align:-1px"></i>${condName(v.a.coord)}:${esc(v.a.content.length>16?v.a.content.slice(0,16)+'…':v.a.content)}</span>`).join('');
  return `
  <div class="form-row" style="margin-bottom:2px">
    <span class="f-lbl">行(斜向)</span><select onchange="S.axisA=this.value;render()">${used.map(d=>`<option value="${d.key}" ${S.axisA===d.key?'selected':''}>${d.name}</option>`).join('')}</select>
    ${bOpts.length?`<span class="f-lbl">层(纵向)</span><select onchange="S.axisB=this.value;render()"><option value="" ${!S.axisB?'selected':''}>(不分层)</option>${bOpts.map(d=>`<option value="${d.key}" ${S.axisB===d.key?'selected':''}>${d.name}</option>`).join('')}</select>`:''}
    ${dimB&&lays.length>1?`<button class="btn sm" onclick="S.cubeExp=!S.cubeExp;render()">${S.cubeExp?'合 上':'拆开看'}</button>`:''}
    <span class="mini-note">列 = 时间(${times.map(t=>t.slice(5)).join(' → ')})· 颜色 = 同一条答案的领地 · 悬停格子看来源</span>
  </div>
  <div class="cube-stage" style="${S.cubeExp?`padding:120px 0 240px`:``}"><div class="cube3" style="width:${W}px;height:${H}px${S.cubeExp?';transform:rotateX(58deg) rotateZ(45deg) scale(.85)':''}">${layersHtml}</div></div>
  <div class="cube-legend">${legendHtml}</div>
  ${offAxis?`<div class="mini-note" style="text-align:center;margin-top:12px">另有 ${offAxis} 条答案挂在其他维度上,切换上方「行 / 层」可见。</div>`:''}`;
}
function tabTimeline(s,T){
  const keys=[...new Set(ASSERTS.filter(a=>a.subj===s.id).map(a=>coordKey(a.coord)))];
  if(!S.tlCoord || !keys.includes(S.tlCoord)) S.tlCoord=keys[0];
  const chain=ASSERTS.filter(a=>a.subj===s.id && coordKey(a.coord)===S.tlCoord).sort((x,y)=>y.vf.localeCompare(x.vf));
  const liveId=(chain.find(a=>!a.revoked&&a.vf<=T)||{}).id;
  return `
  <div class="form-row" style="margin-bottom:14px">
    <span class="f-lbl">选择条件组合(每组条件一条独立时间线)</span>
    <select onchange="S.tlCoord=this.value;render()">${keys.map(k=>`<option ${S.tlCoord===k?'selected':''}>${k}</option>`).join('')}</select>
  </div>
  <div class="tl">
    ${chain.map(a=>`

  const inUse=[...new Set(ASSERTS.filter(a=>a.coord[key]!==undefined).map(a=>a.coord[key]))];
  const missing=inUse.filter(v=>!vals.includes(v));
  if(missing.length){ toast(`取值「${missing.join('、')}」已被答案引用,不能删除`,'err'); return; }
  d.name=name; d.values=vals; d.strategy=document.getElementById('edStrat').value.split('(')[0];
  d.weight=Math.min(100,Math.max(1,parseInt(document.getElementById('edWeight').value)||d.weight||50));

}

/* ================= 答案操作 + 新增知识(共用条件行编辑器) ================= */
function findAns(id){ return ASSERTS.find(a=>a.id===id); }
function nowStamp(){ return TODAY+' '+new Date().toTimeString().slice(0,5); }
function condName(c){ const ks=Object.keys(c); if(!ks.length) return '默认'; return ks.sort().map(k=>(dimByKey(k)?dimByKey(k).name:k)+' = '+c[k]).join(' 且 '); }
let NEW_COORD=[]; let COORD_BOX='naCoord';
function coordRowsHtml(){
  return NEW_COORD.map((c,i)=>{
    const d=dimByKey(c.dim); const isNew=c.val==='__new';
    return `<div class="form-row" style="margin-bottom:8px">
      <select onchange="NEW_COORD[${i}].dim=this.value;NEW_COORD[${i}].val='';renderCoordRows()" style="min-width:130px">
        <option value="">选择维度…</option>
        ${DIMS.filter(x=>x.enabled).map(x=>`<option value="${x.key}" ${c.dim===x.key?'selected':''}>${x.name}</option>`).join('')}
      </select>
      <select onchange="NEW_COORD[${i}].val=this.value;renderCoordRows()" style="min-width:150px" ${!d?'disabled':''}>
        <option value="">选择取值…</option>
        ${d?d.values.map(v=>`<option ${c.val===v?'selected':''}>${v}</option>`).join(''):''}
        ${d?`<option value="__new" ${isNew?'selected':''}>+ 新增取值…</option>`:''}
      </select>
      ${isNew?`<input type="text" placeholder="输入新取值,如:金融场景" value="${esc(c.newVal||'')}" oninput="NEW_COORD[${i}].newVal=this.value" style="min-width:140px">`:''}
      <a class="danger" style="font-size:13px" onclick="NEW_COORD.splice(${i},1);renderCoordRows()">移除</a>
    </div>`;}).join('');
}
function renderCoordRows(){ const box=document.getElementById(COORD_BOX); if(box) box.innerHTML=coordRowsHtml(); }
function addCoordRow(){ NEW_COORD.push({dim:'',val:'',newVal:''}); renderCoordRows(); }
function resolveCoord(){
  const coord={};
  for(const c of NEW_COORD){
    if(!c.dim) continue;
    let v=c.val;
    if(v==='__new'){
      v=(c.newVal||'').trim();
      if(!v){ toast('请填写新增取值的内容','err'); return null; }
      const d=dimByKey(c.dim);
      if(!d.values.includes(v)){ d.values.push(v); toast(`维度「${d.name}」值域已加入「${v}」`,'info'); }
    }
    if(v) coord[c.dim]=v;
  }
  return coord;
}
function openEditAns(id){
  const a=findAns(id);
  NEW_COORD=Object.keys(a.coord).map(k=>({dim:k,val:a.coord[k],newVal:''})); COORD_BOX='eaCoord';
  openModal(`
    <div class="mo-head">编辑答案<button class="mo-close" onclick="closeModal()">✕</button></div>
    <div class="mo-body">
      <div class="mf"><label><span class="req">*</span>答案内容</label><textarea id="eaContent">${esc(a.content)}</textarea></div>
      <div class="mf"><label><span class="req">*</span>生效时间</label><input type="date" id="eaVf" value="${TODAY}" max="${TODAY}"></div>
      <div class="mf"><label>适用条件(可改;全部移除 = 变成默认答案)</label>
        <div id="eaCoord"></div>
        <button class="btn sm" style="margin-top:8px" onclick="addCoordRow()">+ 加一个条件</button>
        <div class="hint">条件不变:旧版本留档、生成新版本;条件改了:整条答案迁到新条件,留痕记录迁移</div></div>
    </div>
    <div class="mo-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn primary" onclick="saveEditAns('${id}')">确 定</button></div>`);
  renderCoordRows();
}
function saveEditAns(id){
  const a=findAns(id);
  const content=document.getElementById('eaContent').value.trim();
  const vf=document.getElementById('eaVf').value;
  if(!content){ toast('请填写答案内容','err'); return; }
  if(!vf){ toast('请选择生效时间','err'); return; }
  const coord=resolveCoord(); if(coord===null) return;
  const oldK=coordKey(a.coord), newK=coordKey(coord);
  if(oldK===newK){
    ASSERTS.push({id:'n'+Date.now(), subj:a.subj, coord, content, vf, by:'彭总', src:'人工填报', revoked:false});
    LOGS.unshift({t:nowStamp(), subj:a.subj, who:'彭总', act:'改答案', tgt:'条件 {'+condName(coord)+'}', before:a.content, after:content, src:'人工编辑', state:'生效'});
    toast('已生成新版本,旧版本留档','ok');
  }else{
    ASSERTS.filter(x=>x.subj===a.subj && coordKey(x.coord)===oldK).forEach(x=>x.revoked=true);
    ASSERTS.push({id:'n'+Date.now(), subj:a.subj, coord, content, vf, by:'彭总', src:'人工填报', revoked:false});
    LOGS.unshift({t:nowStamp(), subj:a.subj, who:'彭总', act:'改答案(条件迁移)', tgt:'条件 {'+condName(a.coord)+'} → {'+condName(coord)+'}', before:a.content, after:content, src:'人工编辑', state:'生效'});
    toast(`条件已从「${condName(a.coord)}」迁到「${condName(coord)}」,原链留档`,'ok');
  }
  closeModal(); render();
}

      <div style="background:var(--pale);border-radius:10px;padding:12px 16px;font-size:13.5px;color:var(--ink-1);margin:10px 0;line-height:1.8">${esc(a.content)}</div>
      <div class="hint">原默认答案自动留档;这条带条件的答案(${condName(a.coord)})保持不变。操作留痕,可撤回。</div>
    </div>
    <div class="mo-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn primary" onclick="doPromoteAns('${id}')">确 定</button></div>`);

function openDeleteAns(id){
  const a=findAns(id);
  openModal(`
    <div class="mo-head">删除答案确认<button class="mo-close" onclick="closeModal()">✕</button></div>
    <div class="mo-body">
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.9">将删除「<b>${condName(a.coord)}</b>」条件下的答案:<br><b>${esc(a.content)}</b></p>
      <div class="mf" style="margin-top:12px"><label><span class="req">*</span>删除原因</label><input type="text" id="delReason" placeholder="必填,写入留痕"></div>
      <div class="risk">删除为逻辑删除:该条件下将不再返回此答案;全部历史版本与留痕保留,可在「时间线 · 历史版本」查看并恢复。</div>
    </div>
    <div class="mo-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn danger" onclick="doDeleteAns('${id}')">确认删除</button></div>`);
}
function doDeleteAns(id){
  const reason=document.getElementById('delReason').value.trim();
  if(!reason){ toast('请填写删除原因','err'); return; }
  const a=findAns(id);
  const k=coordKey(a.coord);
  ASSERTS.filter(x=>x.subj===a.subj && coordKey(x.coord)===k).forEach(x=>x.revoked=true);
  LOGS.unshift({t:nowStamp(), subj:a.subj, who:'彭总', act:'删除答案(逻辑删除)', tgt:'条件 {'+condName(a.coord)+'}', before:a.content, after:'(删除原因:'+reason+')', src:'人工编辑', state:'生效'});
  closeModal(); render(); toast('已删除,历史留档、可恢复','ok');
}

/* ================= 新增知识 ================= */
function openNewAssert(subjId){
  NEW_COORD=[]; COORD_BOX='naCoord';
  openModal(`
    <div class="mo-head">新增知识<button class="mo-close" onclick="closeModal()">✕</button></div>
    <div class="mo-body">
      <div class="mf"><label><span class="req">*</span>知识主体</label>
        <select id="naSubj" onchange="document.getElementById('naNewSubj').style.display=this.value==='__new'?'block':'none'">
          ${SUBJECTS.map(x=>`<option value="${x.id}" ${x.id===subjId?'selected':''}>${x.title}</option>`).join('')}
          <option value="__new">+ 新建知识主体…</option>
        </select>
        <div id="naNewSubj" style="display:none;margin-top:8px">
          <input type="text" id="naNewTitle" placeholder="新知识标题,如:政策申报口径" style="width:100%;margin-bottom:8px">
          <input type="text" id="naNewCat" placeholder="分类,如:认知/概念(可不填)" style="width:100%">
        </div></div>
      <div class="mf"><label><span class="req">*</span>答案内容(这个条件组合下的说法)</label><textarea id="naContent" placeholder="例:苹果是一家公司"></textarea></div>
      <div class="mf"><label><span class="req">*</span>生效时间</label><input type="date" id="naVf" value="${S.qTime}"></div>
      <div class="mf"><label>适用条件(只写你关心的;不写 = 默认答案,处处适用)</label>
        <div id="naCoord"></div>
        <button class="btn sm" style="margin-top:8px" onclick="addCoordRow()">+ 加一个条件</button>
        <div class="hint">取值下拉里选「+ 新增取值…」可直接扩充维度值域;同条件已有答案时,本条成为新版本</div></div>
    </div>
    <div class="mo-foot"><button class="btn" onclick="closeModal()">取 消</button><button class="btn primary" onclick="saveAssert()">确 定</button></div>`);
  addCoordRow();
}
function saveAssert(){
  const content=document.getElementById('naContent').value.trim();
  const vf=document.getElementById('naVf').value;
  let subj=document.getElementById('naSubj').value;
  if(!content){ toast('请填写答案内容','err'); return; }
  if(!vf){ toast('请选择生效时间','err'); return; }
  if(subj==='__new'){
    const title=document.getElementById('naNewTitle').value.trim();
    if(!title){ toast('请填写新知识标题','err'); return; }
    const cat=document.getElementById('naNewCat').value.trim()||'未分类';
    subj='S'+Date.now();
    SUBJECTS.push({id:subj, title, cat, code:'KB-'+String(SUBJECTS.length+1).padStart(4,'0'), created:vf, by:'彭总'});
  }
  const coord=resolveCoord(); if(coord===null) return;
  const isNewVer=ASSERTS.some(a=>a.subj===subj && coordKey(a.coord)===coordKey(coord));
  ASSERTS.push({id:'n'+Date.now(), subj, coord, content, vf, by:'彭总', src:'人工填报', revoked:false});
  LOGS.unshift({t:vf+' '+new Date().toTimeString().slice(0,5), subj, who:'彭总', act:isNewVer?'写新版本':'写答案', tgt:'条件 {'+condName(coord)+'}', before:'—', after:content, src:'人工编辑', state:'生效'});
  closeModal(); render();
  toast(isNewVer?'同条件已有答案:这条成为新版本,旧版留档':`已写入,适用条件:${condName(coord)}`,'ok');
}

/* ================= 渲染入口 ================= */
function render(){
  const C=document.getElementById('content');
  if(S.page==='list') C.innerHTML=pageList();
  else if(S.page==='detail') C.innerHTML=pageDetail();
  else if(S.page==='dims') C.innerHTML=pageDims();
  else if(S.page==='logs') C.innerHTML=pageLogs();
}
const tipCube=document.createElement('div'); tipCube.id='tipCube'; document.body.appendChild(tipCube);
document.addEventListener('mousemove',e=>{
  const c=e.target.closest && e.target.closest('.c3cell');
  if(c && c.dataset.tip){ tipCube.innerHTML=c.dataset.tip; tipCube.style.opacity=1;
    tipCube.style.left=Math.min(e.clientX+14,innerWidth-310)+'px'; tipCube.style.top=(e.clientY+16)+'px'; }
  else tipCube.style.opacity=0;
});
renderNav(); render();
</script>
