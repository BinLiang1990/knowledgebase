[project]
name = "kb-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "binliang1990", email = "codingsnake@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    # 答案关联的网关客户端(gateway.py)在运行时用 httpx —— 之前它只是
    # dev 组里 TestClient 的传递依赖，提升为正式依赖
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# 依赖源固定为阿里云 PyPI 镜像：uv.lock 会把每个包的 registry 记录成这里的
# URL，`uv sync --frozen`（Docker build 里那步）按 lock 记录的源下载——
# 环境变量 UV_INDEX_URL/UV_DEFAULT_INDEX 改不动已生成的 lock，之前 Dockerfile
# 只配环境变量导致国内服务器 build 时直连 pypi.org 卡死（2026-08-14）。
# 阿里云镜像是公网可达的，办公网/服务器都能用；换源后需 `uv lock` 重新生成。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
