[project]
name = "kb-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "binliang1990", email = "codingsnake@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
kb-backend = "kb_backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
