services:
  kb-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kb-backend:latest
    container_name: kb-backend
    restart: unless-stopped
    # 只绑 127.0.0.1：对外的入口是同一台机器上 nginx 的 /kb-api 反代（见
    # Docker部署.md「挂在 /kb-api 子路径下」一节），8000 端口不需要对公网暴露。
    ports:
      - "127.0.0.1:8000:8000"
    # 跟非 Docker 部署共用同一份 backend/.env，不需要另外维护一套环境变量。
    env_file:
      - ../.env
    environment:
      UVICORN_WORKERS: "2"
