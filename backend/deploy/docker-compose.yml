services:
  kb-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kb-backend:latest
    container_name: kb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 跟非 Docker 部署共用同一份 backend/.env，不需要另外维护一套环境变量。
    env_file:
      - ../.env
    environment:
      UVICORN_WORKERS: "2"
